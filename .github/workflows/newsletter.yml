# Unified Newsletter Generation Workflow
# Uses config.yaml + newsletter_generator.py for both energy and AI newsletters
name: newsletter

on:
  schedule:
    - cron: '5 19 * * *'  # UTC 21:05 = KST 06:05 (매일 한국 시간 새벽 6시 5분경 실행)
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: main          # schedule에서 detached HEAD 방지
          fetch-depth: 0     # 전체 히스토리 필요 시 유지

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Verify critical imports
        run: |
          # selectolax 1.0 회귀(Modest 백엔드 제거)를 실행 전에 조기 감지한다.
          # YAML run 블록은 밑줄/백슬래시 줄바꿈이 깨지므로 importlib.metadata로
          # 버전을 읽고 한 줄로 평평하게 유지한다.
          python -c "import importlib.metadata as m, googlenewsdecoder; v=m.version('selectolax'); print('selectolax', v); assert int(v.split('.')[0]) < 1, 'selectolax 1.0+ is incompatible with googlenewsdecoder'; print('imports OK')"


      - name: Create .env file
        run: |
          echo "OPENAI_API_KEY=$OPENAI_API_KEY" >> .env
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}

      - name: Run newsletter generator
        run: python newsletter_generator.py

      - name: Commit newsletter files if changed
        uses: stefanzweifel/git-auto-commit-action@v7
        with:
          commit_message: "Update newsletters ${{ github.run_id }} — $(date +'%Y-%m-%d %H:%M:%S KST')"
          file_pattern: 'newsletter.html newsletter2.html data/*.json data/index.json'
          disable_globbing: true
          commit_user_name: github-actions[bot]
          commit_user_email: github-actions[bot]@users.noreply.github.com
          commit_author: github-actions[bot] <github-actions[bot]@users.noreply.github.com>
          push_options: '--force-with-lease'  # 필요 시 제거 가능 (대부분 기본 push로 충분)
